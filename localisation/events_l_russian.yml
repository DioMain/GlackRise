l_russian:
  DZD.1.t: "Востание с пепла"
  DZD.1.d: "Наконец закончился великий раскол пока снова жить."
  DZD.1.a: "Мы сможем!"

  DZD.2.t: "Новый путь"
  DZD.2.d: "Хоть мы и не можем вернуть прежний мир но мы можем построить новый. У нас есть три пути. Мы можем отдать правление министерсву внутренних дел, можем оставить всё работягам драздовской коммуны которые уже у руля, или же поддатся на большое количество анимешников которые рвутся к власти"
  DZD.2.a: "Пора сделать выбор"
 