l_russian:
  DZD.1.t: "Востание с пепла"
  DZD.1.d: "Человечество пережело еще одну большую катастрофу оданко жизнь на этом не заканчивается. Нужно жить дальше."
  DZD.1.a: "Мы сможем!"

  DZD.2.t: "Новый путь"
  DZD.2.d: "Хоть мы и не можем вернуть прежний мир но мы можем построить новый. У нас есть три пути. Мы можем отдать правление министерсву внутренних дел, можем оставить всё работягам драздовской коммуны которые уже у руля, или же поддатся на большое количество анимешников которые рвутся к власти"
  DZD.2.a: "Пора сделать выбор"

  DZD.3.t: "Проблема старых дней"
  DZD.3.d: "Хоть и старого миропорядка уже давно, однако люди из Беластока после выбранного нами пути на востановление Республики Беларусь начали не годовать и называть себя нейким словом Поляки. Ладно если бы таких людей было бы не много но их к сожелению большнство"
  DZD.3.a: "С этим нужно будет что то сделать"

  DZD.4.t: "МВД требует Гомель"
  DZD.4.a: "Ничего не поделаешь"
  DZD.4.b: "С чего в друг!"

  DZD.5.t: "Они уступают Гомель"
  DZD.5.a: "Отлично!"

  DZD.6.t: "Они упёрлись"
  DZD.6.a: "Они прекрасно знают альтернативу..."

  DZD.7.t: "МВД требует Мозырь"
  DZD.7.a: "Ничего не поделаешь"
  DZD.7.b: "Мозырь всегда принадлежал нам!"

  DZD.8.t: "Они уступают Мозырь"
  DZD.8.a: "Отлично!"

  DZD.9.t: "Они упёрлись"
  DZD.9.a: "Они прекрасно знают альтернативу..."
 